<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>診察会話 フラッシュカード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#1a2744;--teal:#2a9d8f;--teal-light:#3bbfb0;--cream:#f8f5f0;--gold:#e9c46a;--coral:#e76f51;--white:#fff;--shadow:0 20px 60px rgba(26,39,68,.18)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:'Noto Sans JP',sans-serif;background:var(--navy);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 16px 60px;overflow-x:hidden}
body::before{content:'';position:fixed;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(42,157,143,.15) 0%,transparent 70%);pointer-events:none}
header{text-align:center;margin-bottom:14px}
header h1{font-family:'Lora',serif;font-size:clamp(1.1rem,4.5vw,1.5rem);color:var(--cream);letter-spacing:.04em;margin-bottom:2px}
header p{color:var(--teal-light);font-size:.72rem;font-weight:300;letter-spacing:.1em}
.mode-bar{width:100%;max-width:480px;display:flex;gap:8px;margin-bottom:14px}
.mode-btn{flex:1;max-width:160px;padding:10px 0;border:none;border-radius:50px;font-family:'Noto Sans JP',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s}
.mode-btn.active{background:var(--teal);color:#fff;box-shadow:0 4px 16px rgba(42,157,143,.4)}
.mode-btn:not(.active){background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6)}
.progress-wrap{width:100%;max-width:480px;margin-bottom:12px}
.progress-info{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.5);font-size:.72rem;margin-bottom:6px}
.card-num{color:var(--gold);font-weight:700;font-size:.88rem}
.progress-bar-bg{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-light));border-radius:2px;transition:width .4s ease}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:4px 12px;font-size:.75rem;color:rgba(255,255,255,.6)}
.stat-chip .dot{width:7px;height:7px;border-radius:50%}
.dot-ok{background:var(--teal)}.dot-retry{background:var(--coral)}
.stat-chip b{color:#fff;font-weight:700}

/* ── FLASH CARD ── */
.card-viewport{width:100%;max-width:480px;overflow:hidden;margin-bottom:12px;border-radius:20px}
.card-track{display:flex;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.card-track.no-transition{transition:none}
.card-slot{flex:0 0 100%;padding:0 2px}
.card{width:100%;min-height:230px;position:relative;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer;border-radius:20px}
.card.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center}
.card-front{background:var(--white);box-shadow:var(--shadow)}
.card-back{background:linear-gradient(135deg,var(--teal) 0%,#1a6b61 100%);transform:rotateY(180deg);box-shadow:var(--shadow)}
.card-label{font-size:.63rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px;padding:3px 10px;border-radius:20px}
.card-front .card-label{background:rgba(42,157,143,.12);color:var(--teal)}
.card-back .card-label{background:rgba(255,255,255,.15);color:rgba(255,255,255,.9)}
.card-text{font-size:clamp(.92rem,3.8vw,1.18rem);line-height:1.7;font-weight:500;overflow-wrap:anywhere}
.card-front .card-text{color:var(--navy)}
.card-back .card-text{color:#fff;font-family:'Lora',serif;font-style:italic}
.tap-hint{position:absolute;bottom:11px;right:14px;font-size:.6rem;letter-spacing:.06em;opacity:.35}
.card-front .tap-hint{color:var(--navy)}.card-back .tap-hint{color:#fff}
.audio-btn{margin-top:16px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:50px;padding:8px 18px;color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:.76rem;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .2s}
.audio-btn:active{background:rgba(255,255,255,.3)}
.swipe-hint{display:flex;align-items:center;justify-content:center;gap:14px;color:rgba(255,255,255,.25);font-size:.66rem;margin-bottom:10px;letter-spacing:.04em}

/* action buttons */
.actions{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btn{border:none;border-radius:14px;padding:14px 10px;font-family:'Noto Sans JP',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .2s,transform .15s}
.btn:disabled{opacity:.3;pointer-events:none}
.btn:active{transform:scale(.97)}
.btn-ok{background:linear-gradient(135deg,var(--teal),#1a6b61);color:#fff;box-shadow:0 5px 20px rgba(42,157,143,.35)}
.btn-retry{background:linear-gradient(135deg,var(--coral),#c45b3c);color:#fff;box-shadow:0 5px 20px rgba(231,111,81,.35)}
.nav{width:100%;max-width:480px;display:flex;gap:8px;justify-content:center}
.btn-nav{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 20px;color:var(--cream);font-family:'Noto Sans JP',sans-serif;font-size:.82rem;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .2s;font-weight:500}
.btn-nav:active{background:rgba(255,255,255,.18)}
.btn-nav:disabled{opacity:.3;pointer-events:none}
.btn-shuffle{background:rgba(233,196,106,.12);border-color:rgba(233,196,106,.25);color:var(--gold)}
.btn-reset-inline{width:100%;max-width:480px;margin-top:8px;padding:11px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.65);font-family:'Noto Sans JP',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-reset-inline:active{background:rgba(255,255,255,.14)}

/* completion */
.completion{display:none;width:100%;max-width:480px;background:var(--white);border-radius:24px;padding:36px 24px;text-align:center;box-shadow:var(--shadow)}
.completion.show{display:block}
#flashSection.completed .card-viewport,#flashSection.completed .swipe-hint,#flashSection.completed .actions,#flashSection.completed .nav,#flashSection.completed .btn-reset-inline{display:none}
.completion-icon{font-size:2.6rem;margin-bottom:10px}
.completion h2{font-family:'Lora',serif;color:var(--navy);font-size:1.35rem;margin-bottom:6px}
.completion p{color:rgba(26,39,68,.5);font-size:.83rem;margin-bottom:22px;line-height:1.6}
.completion-stats{display:flex;justify-content:center;gap:28px;margin-bottom:24px}
.completion-stat .num{font-size:1.9rem;font-weight:700;line-height:1}
.num-ok{color:var(--teal)}.num-retry{color:var(--coral)}
.completion-stat .lbl{font-size:.7rem;color:rgba(26,39,68,.45);margin-top:4px}
.btn-restart{width:100%;padding:14px;border:none;border-radius:14px;background:var(--navy);color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn-restart:active{background:var(--teal)}
.btn-retry-only{width:100%;padding:12px;border:2px solid var(--coral);border-radius:14px;background:transparent;color:var(--coral);font-family:'Noto Sans JP',sans-serif;font-size:.83rem;font-weight:700;cursor:pointer}
.btn-retry-only:disabled{opacity:.3;pointer-events:none}

/* ── AUDIO MODE ── */
.audio-mode{display:none;width:100%;max-width:480px}
.audio-mode.show{display:block}
.np-viewport{width:100%;overflow:hidden;border-radius:20px;margin-bottom:14px}
.np-track{display:flex;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.np-track.no-transition{transition:none}
.np-slot{flex:0 0 100%;padding:0 2px}
.now-playing-card{background:var(--white);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:var(--shadow);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.np-label{font-size:.63rem;font-weight:700;letter-spacing:.15em;padding:3px 10px;border-radius:20px}
.np-label.ja{background:rgba(42,157,143,.12);color:var(--teal)}
.np-label.en{background:rgba(233,196,106,.15);color:#b8861a}
.np-text-ja{font-size:clamp(.92rem,3.8vw,1.12rem);color:var(--navy);font-weight:500;line-height:1.7;overflow-wrap:anywhere}
.np-text-en{font-size:clamp(.85rem,3.5vw,1rem);color:#2a6b63;font-family:'Lora',serif;font-style:italic;line-height:1.7;overflow-wrap:anywhere}
.np-counter{font-size:.7rem;color:rgba(26,39,68,.4);margin-top:2px}
.np-swipe-hint{font-size:.62rem;color:rgba(26,39,68,.25);letter-spacing:.04em}
.waveform{display:flex;align-items:center;gap:3px;height:26px;margin:2px 0}
.wave-bar{width:4px;border-radius:2px;background:var(--teal);opacity:.7;animation:wave 1s ease-in-out infinite}
.wave-bar:nth-child(1){height:8px;animation-delay:0s}
.wave-bar:nth-child(2){height:18px;animation-delay:.1s}
.wave-bar:nth-child(3){height:24px;animation-delay:.2s}
.wave-bar:nth-child(4){height:14px;animation-delay:.3s}
.wave-bar:nth-child(5){height:20px;animation-delay:.4s}
.wave-bar:nth-child(6){height:10px;animation-delay:.5s}
.wave-bar:nth-child(7){height:22px;animation-delay:.15s}
.wave-bar:nth-child(8){height:16px;animation-delay:.35s}
.waveform.paused .wave-bar{animation-play-state:paused;opacity:.3}
@keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.8)}}
.audio-controls{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.ctrl-row{display:flex;align-items:center;gap:10px}
.ctrl-label{color:rgba(255,255,255,.45);font-size:.7rem;min-width:56px;letter-spacing:.04em}
.speed-btns,.interval-btns{display:flex;gap:6px}
.speed-btn,.interval-btn{padding:5px 11px;border-radius:20px;border:none;font-family:'Noto Sans JP',sans-serif;font-size:.73rem;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.speed-btn.active{background:var(--teal);color:#fff}
.interval-btn.active{background:var(--gold);color:var(--navy)}
.play-controls{display:flex;gap:10px;justify-content:center}
.btn-play{flex:1;max-width:200px;padding:14px 0;border:none;border-radius:14px;font-family:'Noto Sans JP',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,var(--teal),#1a6b61);color:#fff;box-shadow:0 5px 20px rgba(42,157,143,.4)}
.btn-play:active{transform:scale(.97)}
.btn-stop{padding:14px 18px;border:none;border-radius:14px;font-family:'Noto Sans JP',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;gap:6px}
.btn-stop:active{background:rgba(255,255,255,.2)}
.bg-notice{margin-top:12px;background:rgba(233,196,106,.1);border:1px solid rgba(233,196,106,.2);border-radius:12px;padding:10px 14px;color:rgba(255,255,255,.6);font-size:.72rem;line-height:1.6;text-align:center}
</style>
</head>
<body>

<header>
  <h1>診察会話 フラッシュカード</h1>
  <p>MEDICAL CONSULTATION FLASHCARDS</p>
</header>

<div class="mode-bar">
  <button class="mode-btn active" id="modeFlash" onclick="setMode('flash')">📇 暗記カード</button>
  <button class="mode-btn" id="modeAudio" onclick="setMode('audio')">🎧 連続再生</button>
</div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="progressLabel">進捗</span>
    <span class="card-num" id="cardNum">1 / 112</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:1%"></div>
  </div>
</div>

<!-- Stats -->
<div class="stats" id="statsBar">
  <div class="stat-chip"><span class="dot dot-ok"></span>覚えた<b id="okCount">0</b></div>
  <div class="stat-chip"><span class="dot dot-retry"></span>要復習<b id="retryCount">0</b></div>
</div>

<!-- ===== FLASH MODE ===== -->
<div id="flashSection" style="width:100%;max-width:480px">

  <div class="card-viewport" id="cardViewport">
    <div class="card-track" id="cardTrack">
      <!-- cards injected by JS -->
    </div>
  </div>

  <div class="swipe-hint">← スワイプで移動 →&nbsp;&nbsp;｜&nbsp;&nbsp;タップで反転</div>

  <div class="actions">
    <button class="btn btn-retry" id="btnRetry" onclick="markCard('retry')" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/></svg>
      もう一度
    </button>
    <button class="btn btn-ok" id="btnOk" onclick="markCard('ok')" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      覚えた！
    </button>
  </div>

  <div class="nav">
    <button class="btn-nav" id="btnPrev" onclick="slideFlash(-1)" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>前へ
    </button>
    <button class="btn-nav" style="background:rgba(233,196,106,.12);border-color:rgba(233,196,106,.25);color:var(--gold)" onclick="shuffleCards()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>シャッフル
    </button>
    <button class="btn-nav" id="btnNext" onclick="slideFlash(1)">
      次へ<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <button class="btn-reset-inline" onclick="restartAll()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg>
    最初からやり直す
  </button>

  <div class="completion" id="completion">
    <div class="completion-icon">🎉</div>
    <h2>完了しました！</h2>
    <p>全カードを確認しました。<br>結果を確認してもう一度挑戦しましょう。</p>
    <div class="completion-stats">
      <div class="completion-stat"><div class="num num-ok" id="finalOk">0</div><div class="lbl">覚えた</div></div>
      <div class="completion-stat"><div class="num num-retry" id="finalRetry">0</div><div class="lbl">要復習</div></div>
    </div>
    <button class="btn-restart" onclick="restartAll()">最初からやり直す</button>
    <button class="btn-retry-only" id="btnRetryOnly" onclick="restartRetry()">要復習のみ再挑戦</button>
  </div>
</div>

<!-- ===== AUDIO MODE ===== -->
<div class="audio-mode" id="audioMode">

  <div class="np-viewport" id="npViewport">
    <div class="np-track" id="npTrack">
      <!-- slots injected by JS -->
    </div>
  </div>

  <div class="audio-controls">
    <div class="ctrl-row">
      <span class="ctrl-label">🔊 速度</span>
      <div class="speed-btns">
        <button class="speed-btn" data-speed="0.7" onclick="setSpeed(this)">遅い</button>
        <button class="speed-btn active" data-speed="0.9" onclick="setSpeed(this)">普通</button>
        <button class="speed-btn" data-speed="1.1" onclick="setSpeed(this)">速い</button>
      </div>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">⏱ 間隔</span>
      <div class="interval-btns">
        <button class="interval-btn" data-ms="500" onclick="setIntervalMs(this)">短い</button>
        <button class="interval-btn active" data-ms="1200" onclick="setIntervalMs(this)">普通</button>
        <button class="interval-btn" data-ms="2500" onclick="setIntervalMs(this)">長い</button>
      </div>
    </div>
  </div>

  <div class="play-controls">
    <button class="btn-play" id="btnPlay" onclick="togglePlay()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>再生開始
    </button>
    <button class="btn-stop" onclick="stopAudio()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>停止
    </button>
  </div>

  <div class="bg-notice">
    🔒 画面オフ・他アプリ使用中は端末の仕様で音声が止まることがあります。<br>練習中は画面を開いたままご利用ください。
  </div>
</div>

<script>
const ALL_CARDS = [
  ["こんにちは","Hello"],
  ["院長の近藤と申します。","My name is Kondo, the clinic director."],
  ["席にお座りください。","Please have a seat."],

  ["出産歴はありますか？","Do you have a history of childbirth?"],
  ["何回出産されましたか？","How many times have you given birth?"],
  ["立ち仕事の時期はありましたか？","Have you ever had a job that required standing for long periods?"],
  ["現在はどうですか？","What about now?"],
  ["ご家族に下肢静脈瘤の方はいますか？","Does anyone in your family have varicose veins?"],
  ["なにか一生懸命やっていた運動はありますか？","Have you ever been actively involved in any sports or exercise?"],
  ["他の病気について聞かせてください。","Please tell me about any other medical conditions you have."],
  ["持病はありますか？","Do you have any chronic conditions?"],

  ["どのような手術を受けましたか？","What kind of surgery did you have?"],

  ["脚の超音波検査を行います。","I'm going to perform an ultrasound on your leg."],
  ["ズボンと靴下を脱いでください。","Please take off your pants and socks."],
  ["立った状態で検査を行います。","We'll perform the exam while you're standing."],
  ["後ろを向いてください。","Please turn around."],
  ["それではこちらを向いてください。","Now, please turn this way."],
  ["これは脚の横断面です。","This is a cross-section of your leg."],
  ["これが皮膚で、その下が皮下脂肪です。","This is the skin, and beneath it is subcutaneous fat."],
  ["ここに見える黒い円が静脈の断面になります。","The black circles you see here are cross-sections of the veins."],
  ["通常の大きさは直径で２−３mm程度です。","Normally, they are about 2 to 3 mm in diameter."],
  ["これが約１０mm程度まで拡張しています。","Here, they have dilated to about 10 mm."],

// ===========================
// STATE
// ===========================
const BASE_DECK = ALL_CARDS.map((pair, id) => ({ id, ja: pair[0], en: pair[1] }));
const STORAGE_KEY = 'hanaFlashcardsProgress.v2';

let deck = [...BASE_DECK];
let flashIndex = 0;
let flippedSet = new Set(); // which deck positions are flipped
let results = {};
let currentMode = 'flash';

let audioIndex = 0;
let audioPlaying = false;
let audioSpeed = 0.9;
let audioIntervalMs = 1200;
let audioAbort = false;
let audioRunId = 0;
let suppressNextTap = false;

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}

function clampIndex(value, total) {
  if (!total) return 0;
  const num = Number.isFinite(Number(value)) ? Number(value) : 0;
  return Math.min(Math.max(0, Math.floor(num)), total - 1);
}

function normalizeResults(savedResults) {
  if (!savedResults || typeof savedResults !== 'object') return {};
  return Object.fromEntries(
    Object.entries(savedResults).filter(([id, value]) => BASE_DECK[Number(id)] && (value === 'ok' || value === 'retry'))
  );
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      deckIds: deck.map(card => card.id),
      flashIndex,
      results,
      currentMode,
      audioIndex,
      audioSpeed,
      audioIntervalMs
    }));
  } catch (_) {}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);

    if (Array.isArray(saved.deckIds)) {
      const savedDeck = saved.deckIds.map(id => BASE_DECK[Number(id)]).filter(Boolean);
      if (savedDeck.length) deck = savedDeck;
    }

    results = normalizeResults(saved.results);
    flashIndex = clampIndex(saved.flashIndex, deck.length);
    audioIndex = clampIndex(saved.audioIndex, ALL_CARDS.length);

    const savedSpeed = Number(saved.audioSpeed);
    if ([0.7, 0.9, 1.1].includes(savedSpeed)) audioSpeed = savedSpeed;

    const savedInterval = Number(saved.audioIntervalMs);
    if ([500, 1200, 2500].includes(savedInterval)) audioIntervalMs = savedInterval;

    if (saved.currentMode === 'audio') currentMode = 'audio';
  } catch (_) {}
}

// MODE
// ===========================
function setMode(mode, resetAudio=true) {
  currentMode = mode;
  document.getElementById('modeFlash').classList.toggle('active', mode==='flash');
  document.getElementById('modeAudio').classList.toggle('active', mode==='audio');
  document.getElementById('flashSection').style.display = mode==='flash' ? '' : 'none';
  document.getElementById('audioMode').classList.toggle('show', mode==='audio');
  document.getElementById('statsBar').style.display = mode==='flash' ? '' : 'none';
  if (mode==='audio') {
    if (resetAudio) stopAudio();
    else {
      audioPlaying = false;
      audioAbort = true;
      setBtnPlay(false);
      slideAudio(audioIndex, false);
    }
    updateProgress(audioIndex, ALL_CARDS.length);
  } else {
    if (audioPlaying) stopAudio();
    slideFlashTo(flashIndex, false);
    updateProgress(flashIndex, deck.length);
    updateStats();
  }
  saveProgress();
}

// ===========================
// FLASH CARD LOGIC
// ===========================
function tapCard(i) {
  if (suppressNextTap || document.getElementById('completion').classList.contains('show')) {
    suppressNextTap = false;
    return;
  }
  if (i !== flashIndex) return;
  const card = document.getElementById('fc'+i);
  if (!card) return;
  const isFlipped = flippedSet.has(i);
  if (isFlipped) { flippedSet.delete(i); card.classList.remove('flipped'); }
  else { flippedSet.add(i); card.classList.add('flipped'); }
  const nowFlipped = flippedSet.has(i);
  document.getElementById('btnOk').disabled = !nowFlipped;
  document.getElementById('btnRetry').disabled = !nowFlipped;
}

function slideFlashTo(idx, animate=true) {
  const track = document.getElementById('cardTrack');
  idx = clampIndex(idx, deck.length);
  if (!animate) track.classList.add('no-transition');
  track.style.transform = `translateX(-${idx * 100}%)`;
  if (!animate) requestAnimationFrame(() => requestAnimationFrame(() => track.classList.remove('no-transition')));
  flashIndex = idx;
  // reset buttons based on current flip state
  const isFlipped = flippedSet.has(idx);
  document.getElementById('btnOk').disabled = !isFlipped;
  document.getElementById('btnRetry').disabled = !isFlipped;
  document.getElementById('btnPrev').disabled = idx === 0;
  document.getElementById('btnNext').disabled = idx >= deck.length - 1;
  updateProgress(idx, deck.length);
  updateStats();
  saveProgress();
}

function slideFlash(dir) {
  const next = flashIndex + dir;
  if (next < 0 || next >= deck.length) return;
  slideFlashTo(next);
}

function markCard(type) {
  const currentCard = deck[flashIndex];
  if (!currentCard) return;
  results[currentCard.id] = type;
  updateStats();
  if (flashIndex < deck.length - 1) {
    slideFlashTo(flashIndex + 1);
  } else {
    showCompletion();
  }
}

function updateStats() {
  const ok = Object.values(results).filter(v=>v==='ok').length;
  const retry = Object.values(results).filter(v=>v==='retry').length;
  document.getElementById('okCount').textContent = ok;
  document.getElementById('retryCount').textContent = retry;
}

function updateProgress(idx, total) {
  const safeTotal = Math.max(1, total);
  const current = Math.min(idx + 1, safeTotal);
  document.getElementById('cardNum').textContent = `${current} / ${safeTotal}`;
  document.getElementById('progressFill').style.width = Math.max(1,(current/safeTotal)*100)+'%';
}

function shuffleCards() {
  for (let i=deck.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]; }
  flippedSet.clear(); results = {};
  flashIndex = 0;
  document.getElementById('flashSection').classList.remove('completed');
  document.getElementById('completion').classList.remove('show');
  buildFlashCards();
  slideFlashTo(0, false);
}

function showCompletion() {
  document.getElementById('flashSection').classList.add('completed');
  document.getElementById('completion').classList.add('show');
  document.getElementById('progressFill').style.width = '100%';
  const ok=Object.values(results).filter(v=>v==='ok').length;
  const retry=Object.values(results).filter(v=>v==='retry').length;
  document.getElementById('finalOk').textContent=ok;
  document.getElementById('finalRetry').textContent=retry;
  document.getElementById('btnRetryOnly').disabled=retry===0;
  saveProgress();
}

function restartAll() {
  deck=[...BASE_DECK]; flippedSet.clear(); results={}; flashIndex=0;
  document.getElementById('flashSection').classList.remove('completed');
  document.getElementById('completion').classList.remove('show');
  buildFlashCards(); slideFlashTo(0,false);
}

function restartRetry() {
  const retryCards = deck.filter(card=>results[card.id]==='retry');
  if (!retryCards.length) return;
  deck=retryCards; flippedSet.clear(); results={}; flashIndex=0;
  document.getElementById('flashSection').classList.remove('completed');
  document.getElementById('completion').classList.remove('show');
  buildFlashCards(); slideFlashTo(0,false);
}

// ===========================
// SWIPE (universal: touch & mouse)
// ===========================
function addSwipe(el, onLeft, onRight) {
  let startX=0, startY=0, moved=false, mouseDown=false;

  function suppressTapBriefly() {
    suppressNextTap = true;
    setTimeout(() => { suppressNextTap = false; }, 250);
  }

  el.addEventListener('touchstart', e=>{
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    moved=false;
  }, {passive:true});

  el.addEventListener('touchmove', e=>{
    moved=true;
  }, {passive:true});

  el.addEventListener('touchend', e=>{
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if (Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>35) {
      suppressTapBriefly();
      if (dx<0) onLeft(); else onRight();
    }
  }, {passive:true});

  // mouse drag for PC
  el.addEventListener('mousedown', e=>{
    startX=e.clientX; startY=e.clientY; moved=false;
    mouseDown=true;
    e.preventDefault();
  });
  el.addEventListener('mousemove', e=>{
    if (!mouseDown) return;
    if (Math.abs(e.clientX-startX)>8) moved=true;
  });
  el.addEventListener('mouseup', e=>{
    if (!mouseDown) return;
    mouseDown=false;
    const dx=e.clientX-startX;
    const dy=e.clientY-startY;
    if (moved && Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>50) {
      suppressTapBriefly();
      if (dx<0) onLeft(); else onRight();
    }
  });
  el.addEventListener('mouseleave', ()=>{ mouseDown=false; });
}

// Flash card swipe
addSwipe(
  document.getElementById('cardViewport'),
  ()=>{ if(flashIndex<deck.length-1) slideFlash(1); },
  ()=>{ if(flashIndex>0) slideFlash(-1); }
);

// Audio card swipe
addSwipe(
  document.getElementById('npViewport'),
  ()=>{ if(audioIndex<ALL_CARDS.length-1) jumpAudio(audioIndex+1); },
  ()=>{ if(audioIndex>0) jumpAudio(audioIndex-1); }
);

// Keyboard for PC
document.addEventListener('keydown', e=>{
  if (currentMode==='flash') {
    if (document.getElementById('completion').classList.contains('show')) return;
    if (e.key==='ArrowRight') slideFlash(1);
    if (e.key==='ArrowLeft')  slideFlash(-1);
    if (e.key===' ') { e.preventDefault(); tapCard(flashIndex); }
  } else {
    if (e.key==='ArrowRight') jumpAudio(audioIndex+1);
    if (e.key==='ArrowLeft')  jumpAudio(audioIndex-1);
  }
});

// ===========================
// AUDIO MODE
// ===========================
function slideAudio(idx, animate=true) {
  const track = document.getElementById('npTrack');
  idx = clampIndex(idx, ALL_CARDS.length);
  if (!animate) track.classList.add('no-transition');
  track.style.transform = `translateX(-${idx * 100}%)`;
  if (!animate) requestAnimationFrame(()=>requestAnimationFrame(()=>track.classList.remove('no-transition')));
  audioIndex = idx;
  updateProgress(idx, ALL_CARDS.length);
  // waveform state
  document.querySelectorAll('.waveform').forEach((w,i)=>{
    w.classList.toggle('paused', !(audioPlaying && i===idx));
  });
  saveProgress();
}

function jumpAudio(idx) {
  if (idx<0 || idx>=ALL_CARDS.length) return;
  const wasPlaying = audioPlaying;
  if (wasPlaying) {
    audioRunId++;
    audioAbort = true;
    audioPlaying = false;
    cancelSpeech();
  }
  slideAudio(idx);
  if (wasPlaying) {
    const resumeRunId = audioRunId;
    setTimeout(()=>{
      if (audioRunId !== resumeRunId) return;
      audioAbort = false;
      audioPlaying = true;
      setBtnPlay(true);
      audioRunId++;
      runLoop(audioRunId);
    }, 300);
  }
}

function cancelSpeech() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function speakCardEnglish(e, index) {
  const card = deck[index];
  if (!card) return;
  speakOne(e, card.en, 'en-US');
}

function speakOne(e, text, lang) {
  if (e) e.stopPropagation();
  if (!('speechSynthesis' in window)) return;
  cancelSpeech();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = audioSpeed;
  window.speechSynthesis.speak(u);
}

function speakPromise(text, lang) {
  return new Promise(resolve=>{
    if (!('speechSynthesis' in window)) { resolve(); return; }
    cancelSpeech();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = audioSpeed;
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      resolve();
    };
    u.onend = finish; u.onerror = finish;
    window.speechSynthesis.speak(u);
  });
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function runLoop(runId = audioRunId) {
  const total = ALL_CARDS.length;
  while (audioPlaying && !audioAbort && audioIndex < total && runId === audioRunId) {
    const i = audioIndex;
    const [ja, en] = ALL_CARDS[i];

    // show waveform
    const wf = document.getElementById('wf'+i);
    if (wf) wf.classList.remove('paused');

    await speakPromise(ja, 'ja-JP');
    if (!audioPlaying || audioAbort || audioIndex !== i || runId !== audioRunId) break;

    await sleep(audioIntervalMs);
    if (!audioPlaying || audioAbort || audioIndex !== i || runId !== audioRunId) break;

    await speakPromise(en, 'en-US');
    if (!audioPlaying || audioAbort || audioIndex !== i || runId !== audioRunId) break;

    await sleep(audioIntervalMs);
    if (!audioPlaying || audioAbort || audioIndex !== i || runId !== audioRunId) break;

    if (wf) wf.classList.add('paused');

    const next = i + 1;
    if (next >= total) {
      // 完了
      audioPlaying = false;
      audioIndex = 0;
      slideAudio(0, false);
      setBtnPlay(false);
      saveProgress();
      break;
    }
    slideAudio(next);
  }
}

function togglePlay() {
  if (audioPlaying) {
    audioRunId++;
    audioPlaying = false;
    audioAbort = true;
    cancelSpeech();
    document.querySelectorAll('.waveform').forEach(w=>w.classList.add('paused'));
    setBtnPlay(false);
    saveProgress();
  } else {
    audioAbort = false;
    audioPlaying = true;
    audioRunId++;
    setBtnPlay(true);
    runLoop(audioRunId);
    saveProgress();
  }
}

function stopAudio() {
  audioRunId++;
  audioAbort = true;
  audioPlaying = false;
  cancelSpeech();
  audioIndex = 0;
  slideAudio(0, false);
  document.querySelectorAll('.waveform').forEach(w=>w.classList.add('paused'));
  setBtnPlay(false);
  updateProgress(0, ALL_CARDS.length);
  saveProgress();
}

function setBtnPlay(playing) {
  const btn = document.getElementById('btnPlay');
  if (playing) {
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>一時停止';
  } else {
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>再生開始';
  }
}

function setSpeed(btn) {
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  audioSpeed = parseFloat(btn.dataset.speed);
  saveProgress();
}

function setIntervalMs(btn) {
  document.querySelectorAll('.interval-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  audioIntervalMs = parseInt(btn.dataset.ms);
  saveProgress();
}

function syncAudioControls() {
  document.querySelectorAll('.speed-btn').forEach(btn=>{
    btn.classList.toggle('active', Number(btn.dataset.speed) === audioSpeed);
  });
  document.querySelectorAll('.interval-btn').forEach(btn=>{
    btn.classList.toggle('active', Number(btn.dataset.ms) === audioIntervalMs);
  });
}

// ===========================
// INIT
// ===========================
loadProgress();
buildFlashCards();
buildAudioSlots();
syncAudioControls();
slideFlashTo(flashIndex, false);
slideAudio(audioIndex, false);
setMode(currentMode, false);
window.addEventListener('beforeunload', saveProgress);
</script>
</body>

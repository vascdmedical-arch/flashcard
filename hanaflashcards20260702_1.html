<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>診察会話 フラッシュカード</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2744;
    --teal: #2a9d8f;
    --teal-light: #3bbfb0;
    --cream: #f8f5f0;
    --gold: #e9c46a;
    --coral: #e76f51;
    --white: #ffffff;
    --shadow: 0 20px 60px rgba(26,39,68,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--navy);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 40px;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content:''; position:fixed; top:-200px; right:-200px;
    width:600px; height:600px;
    background:radial-gradient(circle,rgba(42,157,143,.15) 0%,transparent 70%);
    pointer-events:none;
  }

  header {
    text-align:center; margin-bottom:16px;
    animation: fadeDown .5s ease both;
  }
  header h1 {
    font-family:'Lora',serif;
    font-size:clamp(1.1rem,4.5vw,1.5rem);
    color:var(--cream); letter-spacing:.04em; margin-bottom:2px;
  }
  header p { color:var(--teal-light); font-size:.72rem; font-weight:300; letter-spacing:.1em; }

  /* Mode toggle */
  .mode-bar {
    display:flex; gap:8px; margin-bottom:14px;
    animation: fadeDown .5s .05s ease both; opacity:0;
  }
  .mode-btn {
    flex:1; max-width:160px;
    padding:10px 0; border:none; border-radius:50px;
    font-family:'Noto Sans JP',sans-serif; font-size:.8rem; font-weight:700;
    cursor:pointer; transition:all .2s; letter-spacing:.03em;
  }
  .mode-btn.active {
    background:var(--teal); color:#fff;
    box-shadow:0 4px 16px rgba(42,157,143,.4);
  }
  .mode-btn:not(.active) {
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    color:rgba(255,255,255,.6);
  }

  /* Progress */
  .progress-wrap {
    width:100%; max-width:480px; margin-bottom:14px;
    animation: fadeDown .5s .1s ease both; opacity:0;
  }
  .progress-info {
    display:flex; justify-content:space-between; align-items:center;
    color:rgba(255,255,255,.5); font-size:.72rem; margin-bottom:6px;
  }
  .card-num { color:var(--gold); font-weight:700; font-size:.88rem; }
  .progress-bar-bg {
    width:100%; height:4px; background:rgba(255,255,255,.08);
    border-radius:2px; overflow:hidden;
  }
  .progress-bar-fill {
    height:100%;
    background:linear-gradient(90deg,var(--teal),var(--teal-light));
    border-radius:2px; transition:width .4s cubic-bezier(.4,0,.2,1);
  }

  /* Stats */
  .stats {
    display:flex; gap:10px; margin-bottom:14px;
    animation: fadeDown .5s .12s ease both; opacity:0;
  }
  .stat-chip {
    display:flex; align-items:center; gap:5px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px; padding:4px 12px;
    font-size:.75rem; color:rgba(255,255,255,.6);
  }
  .stat-chip .dot { width:7px; height:7px; border-radius:50%; }
  .dot-ok { background:var(--teal); }
  .dot-retry { background:var(--coral); }
  .stat-chip b { color:#fff; font-weight:700; }

  /* Card */
  .card-scene {
    width:100%; max-width:480px;
    perspective:1200px; margin-bottom:16px;
    animation: fadeUp .5s .15s ease both; opacity:0;
    touch-action: pan-y;
  }
  .card {
    width:100%; min-height:240px; position:relative;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,0,.2,1);
    cursor:pointer; user-select:none;
  }
  .card.flipped { transform:rotateY(180deg); }

  .card-face {
    position:absolute; inset:0; border-radius:20px;
    backface-visibility:hidden;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px 24px; text-align:center;
  }
  .card-front { background:var(--white); box-shadow:var(--shadow); }
  .card-back {
    background:linear-gradient(135deg,var(--teal) 0%,#1a6b61 100%);
    transform:rotateY(180deg); box-shadow:var(--shadow);
  }

  .card-label {
    font-size:.65rem; font-weight:700; letter-spacing:.15em;
    text-transform:uppercase; margin-bottom:14px;
    padding:3px 10px; border-radius:20px;
  }
  .card-front .card-label { background:rgba(42,157,143,.12); color:var(--teal); }
  .card-back .card-label { background:rgba(255,255,255,.15); color:rgba(255,255,255,.9); }

  .card-text {
    font-size:clamp(.95rem,3.8vw,1.2rem);
    line-height:1.7; font-weight:500;
  }
  .card-front .card-text { color:var(--navy); }
  .card-back .card-text { color:#fff; font-family:'Lora',serif; font-style:italic; }

  .tap-hint {
    position:absolute; bottom:12px; right:16px;
    font-size:.62rem; letter-spacing:.06em; opacity:.35;
    display:flex; align-items:center; gap:3px;
  }
  .card-front .tap-hint { color:var(--navy); }
  .card-back .tap-hint { color:#fff; }

  .audio-btn {
    margin-top:18px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25);
    border-radius:50px; padding:9px 20px;
    color:#fff; font-family:'Noto Sans JP',sans-serif;
    font-size:.78rem; cursor:pointer;
    display:flex; align-items:center; gap:7px;
    transition:background .2s, transform .15s;
  }
  .audio-btn:hover { background:rgba(255,255,255,.25); transform:scale(1.03); }
  .audio-btn:active { transform:scale(.97); }

  /* Swipe hint */
  .swipe-hint {
    display:flex; align-items:center; justify-content:center; gap:16px;
    color:rgba(255,255,255,.25); font-size:.68rem;
    margin-bottom:10px; letter-spacing:.05em;
  }
  .swipe-hint span { display:flex; align-items:center; gap:4px; }

  /* Action buttons */
  .actions {
    width:100%; max-width:480px;
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:12px;
    animation: fadeUp .5s .2s ease both; opacity:0;
  }
  .btn {
    border:none; border-radius:14px; padding:14px 10px;
    font-family:'Noto Sans JP',sans-serif; font-size:.85rem; font-weight:700;
    cursor:pointer; transition:transform .15s, opacity .2s;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:disabled { opacity:.3; cursor:not-allowed; }
  .btn:not(:disabled):hover { transform:translateY(-2px); }
  .btn:not(:disabled):active { transform:translateY(0); }
  .btn-ok {
    background:linear-gradient(135deg,var(--teal) 0%,#1a6b61 100%);
    color:#fff; box-shadow:0 5px 20px rgba(42,157,143,.35);
  }
  .btn-retry {
    background:linear-gradient(135deg,var(--coral) 0%,#c45b3c 100%);
    color:#fff; box-shadow:0 5px 20px rgba(231,111,81,.35);
  }

  /* Nav */
  .nav {
    width:100%; max-width:480px;
    display:flex; gap:8px; justify-content:center;
    animation: fadeUp .5s .25s ease both; opacity:0;
  }
  .btn-nav {
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px; padding:11px 22px;
    color:var(--cream); font-family:'Noto Sans JP',sans-serif;
    font-size:.82rem; cursor:pointer;
    display:flex; align-items:center; gap:5px;
    transition:background .2s, transform .15s; font-weight:500;
  }
  .btn-nav:hover { background:rgba(255,255,255,.13); transform:translateY(-1px); }
  .btn-nav:disabled { opacity:.3; cursor:not-allowed; transform:none !important; }
  .btn-shuffle {
    background:rgba(233,196,106,.12);
    border-color:rgba(233,196,106,.25); color:var(--gold);
  }
  .btn-shuffle:hover { background:rgba(233,196,106,.22); }

  /* ===== AUDIO MODE ===== */
  .audio-mode {
    display:none; width:100%; max-width:480px;
    animation: fadeUp .4s ease both;
  }
  .audio-mode.show { display:block; }

  .now-playing-card {
    background:var(--white); border-radius:20px;
    padding:28px 24px; text-align:center;
    box-shadow:var(--shadow); margin-bottom:14px;
    min-height:180px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
  }
  .np-label {
    font-size:.65rem; font-weight:700; letter-spacing:.15em;
    padding:3px 10px; border-radius:20px;
  }
  .np-label.ja { background:rgba(42,157,143,.12); color:var(--teal); }
  .np-label.en { background:rgba(233,196,106,.15); color:#b8861a; }
  .np-text-ja {
    font-size:clamp(.95rem,3.8vw,1.15rem);
    color:var(--navy); font-weight:500; line-height:1.7;
  }
  .np-text-en {
    font-size:clamp(.88rem,3.5vw,1.05rem);
    color:#2a6b63; font-family:'Lora',serif; font-style:italic; line-height:1.7;
  }
  .np-counter {
    font-size:.72rem; color:rgba(26,39,68,.4); margin-top:4px;
  }

  /* Waveform animation */
  .waveform {
    display:flex; align-items:center; gap:3px; height:28px;
    margin:4px 0;
  }
  .wave-bar {
    width:4px; border-radius:2px;
    background:var(--teal); opacity:.7;
    animation: wave 1s ease-in-out infinite;
  }
  .wave-bar:nth-child(1){height:8px; animation-delay:0s;}
  .wave-bar:nth-child(2){height:18px; animation-delay:.1s;}
  .wave-bar:nth-child(3){height:24px; animation-delay:.2s;}
  .wave-bar:nth-child(4){height:14px; animation-delay:.3s;}
  .wave-bar:nth-child(5){height:20px; animation-delay:.4s;}
  .wave-bar:nth-child(6){height:10px; animation-delay:.5s;}
  .wave-bar:nth-child(7){height:22px; animation-delay:.15s;}
  .wave-bar:nth-child(8){height:16px; animation-delay:.35s;}
  .waveform.paused .wave-bar { animation-play-state:paused; opacity:.3; }
  @keyframes wave {
    0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.8)}
  }

  .audio-controls {
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px; padding:16px 20px;
    display:flex; flex-direction:column; gap:14px;
    margin-bottom:14px;
  }
  .ctrl-row { display:flex; align-items:center; gap:10px; }
  .ctrl-label {
    color:rgba(255,255,255,.45); font-size:.72rem;
    min-width:60px; letter-spacing:.05em;
  }

  /* Speed selector */
  .speed-btns { display:flex; gap:6px; }
  .speed-btn {
    padding:5px 12px; border-radius:20px; border:none;
    font-family:'Noto Sans JP',sans-serif; font-size:.75rem;
    cursor:pointer; transition:all .2s;
    background:rgba(255,255,255,.08); color:rgba(255,255,255,.5);
  }
  .speed-btn.active {
    background:var(--teal); color:#fff;
    box-shadow:0 2px 8px rgba(42,157,143,.3);
  }

  /* Interval selector */
  .interval-btns { display:flex; gap:6px; }
  .interval-btn {
    padding:5px 10px; border-radius:20px; border:none;
    font-family:'Noto Sans JP',sans-serif; font-size:.75rem;
    cursor:pointer; transition:all .2s;
    background:rgba(255,255,255,.08); color:rgba(255,255,255,.5);
  }
  .interval-btn.active {
    background:var(--gold); color:var(--navy);
    box-shadow:0 2px 8px rgba(233,196,106,.3);
  }

  .play-controls {
    display:flex; gap:10px; justify-content:center;
  }
  .btn-play {
    flex:1; max-width:200px;
    padding:15px 0; border:none; border-radius:14px;
    font-family:'Noto Sans JP',sans-serif; font-size:.9rem; font-weight:700;
    cursor:pointer; transition:transform .15s, box-shadow .15s;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg,var(--teal),#1a6b61);
    color:#fff; box-shadow:0 5px 20px rgba(42,157,143,.4);
  }
  .btn-play:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(42,157,143,.5); }
  .btn-play:active { transform:translateY(0); }
  .btn-stop {
    padding:15px 20px; border:none; border-radius:14px;
    font-family:'Noto Sans JP',sans-serif; font-size:.9rem; font-weight:700;
    cursor:pointer; transition:transform .15s;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);
    color:rgba(255,255,255,.7);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-stop:hover { background:rgba(255,255,255,.16); transform:translateY(-1px); }

  /* Completion */
  .completion {
    display:none; width:100%; max-width:480px;
    background:var(--white); border-radius:24px;
    padding:40px 28px; text-align:center;
    box-shadow:var(--shadow);
    animation: fadeUp .5s ease both;
  }
  .completion.show { display:block; }
  .completion-icon { font-size:2.8rem; margin-bottom:12px; }
  .completion h2 { font-family:'Lora',serif; color:var(--navy); font-size:1.4rem; margin-bottom:6px; }
  .completion p { color:rgba(26,39,68,.5); font-size:.85rem; margin-bottom:24px; line-height:1.6; }
  .completion-stats { display:flex; justify-content:center; gap:28px; margin-bottom:28px; }
  .completion-stat { text-align:center; }
  .completion-stat .num { font-size:1.9rem; font-weight:700; line-height:1; }
  .num-ok { color:var(--teal); }
  .num-retry { color:var(--coral); }
  .completion-stat .lbl { font-size:.72rem; color:rgba(26,39,68,.45); margin-top:4px; }
  .btn-restart {
    width:100%; padding:15px; border:none; border-radius:14px;
    background:var(--navy); color:#fff;
    font-family:'Noto Sans JP',sans-serif; font-size:.92rem; font-weight:700;
    cursor:pointer; margin-bottom:10px;
    transition:background .2s, transform .15s;
  }
  .btn-restart:hover { background:var(--teal); transform:translateY(-2px); }
  .btn-retry-only {
    width:100%; padding:13px; border:2px solid var(--coral); border-radius:14px;
    background:transparent; color:var(--coral);
    font-family:'Noto Sans JP',sans-serif; font-size:.85rem; font-weight:700;
    cursor:pointer; transition:background .2s, transform .15s;
  }
  .btn-retry-only:hover { background:rgba(231,111,81,.08); transform:translateY(-2px); }
  .btn-retry-only:disabled { opacity:.3; cursor:not-allowed; }

  /* Flash card section wrapper */
  .flash-section { width:100%; max-width:480px; }

  @keyframes fadeDown {
    from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:translateY(0)}
  }
  @keyframes fadeUp {
    from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)}
  }
  @keyframes slideOutLeft {
    to{opacity:0;transform:translateX(-60px) scale(.95)}
  }
  @keyframes slideOutRight {
    to{opacity:0;transform:translateX(60px) scale(.95)}
  }
  @keyframes slideInLeft {
    from{opacity:0;transform:translateX(60px) scale(.95)} to{opacity:1;transform:translateX(0) scale(1)}
  }
  @keyframes slideInRight {
    from{opacity:0;transform:translateX(-60px) scale(.95)} to{opacity:1;transform:translateX(0) scale(1)}
  }
  .slide-out-left  { animation:slideOutLeft  .22s ease forwards; }
  .slide-out-right { animation:slideOutRight .22s ease forwards; }
  .slide-in-left   { animation:slideInLeft   .25s ease forwards; }
  .slide-in-right  { animation:slideInRight  .25s ease forwards; }
</style>
</head>
<body>

<header>
  <h1>診察会話 フラッシュカード</h1>
  <p>MEDICAL CONSULTATION FLASHCARDS</p>
</header>

<!-- Mode toggle -->
<div class="mode-bar">
  <button class="mode-btn active" id="modeFlash" onclick="setMode('flash')">📇 暗記カード</button>
  <button class="mode-btn" id="modeAudio" onclick="setMode('audio')">🎧 連続再生</button>
</div>

<!-- Progress (shared) -->
<div class="progress-wrap">
  <div class="progress-info">
    <span id="progressLabel">進捗</span>
    <span class="card-num" id="cardNum">1 / 112</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:1%"></div>
  </div>
</div>

<!-- Stats (flash mode only) -->
<div class="stats" id="statsBar">
  <div class="stat-chip"><span class="dot dot-ok"></span> 覚えた <b id="okCount">0</b></div>
  <div class="stat-chip"><span class="dot dot-retry"></span> 要復習 <b id="retryCount">0</b></div>
</div>

<!-- ===== FLASH MODE ===== -->
<div class="flash-section" id="flashSection">

  <div class="card-scene" id="cardScene">
    <div class="card" id="card" onclick="flipCard()">
      <div class="card-face card-front">
        <div class="card-label">🇯🇵 日本語</div>
        <div class="card-text" id="jaText"></div>
        <div class="tap-hint">↩ タップして英語を見る</div>
      </div>
      <div class="card-face card-back">
        <div class="card-label">🇺🇸 English</div>
        <div class="card-text" id="enText"></div>
        <button class="audio-btn" id="audioBtn" onclick="speakEN(event)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          英語を読み上げる
        </button>
        <div class="tap-hint">↩ タップして戻る</div>
      </div>
    </div>
  </div>

  <div class="swipe-hint">
    <span>← 前へ スワイプ</span>
    <span>｜</span>
    <span>次へ スワイプ →</span>
  </div>

  <div class="actions">
    <button class="btn btn-retry" id="btnRetry" onclick="markCard('retry')" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.96"/></svg>
      もう一度
    </button>
    <button class="btn btn-ok" id="btnOk" onclick="markCard('ok')" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      覚えた！
    </button>
  </div>

  <div class="nav">
    <button class="btn-nav" id="btnPrev" onclick="navigate(-1)" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      前へ
    </button>
    <button class="btn-nav btn-shuffle" onclick="shuffleCards()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
      シャッフル
    </button>
    <button class="btn-nav" id="btnNext" onclick="navigate(1)">
      次へ
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- Completion -->
  <div class="completion" id="completion">
    <div class="completion-icon">🎉</div>
    <h2>完了しました！</h2>
    <p>全カードを確認しました。<br>結果を確認してもう一度挑戦しましょう。</p>
    <div class="completion-stats">
      <div class="completion-stat">
        <div class="num num-ok" id="finalOk">0</div>
        <div class="lbl">覚えた</div>
      </div>
      <div class="completion-stat">
        <div class="num num-retry" id="finalRetry">0</div>
        <div class="lbl">要復習</div>
      </div>
    </div>
    <button class="btn-restart" onclick="restartAll()">最初からやり直す</button>
    <button class="btn-retry-only" id="btnRetryOnly" onclick="restartRetry()">要復習のみ再挑戦</button>
  </div>

</div><!-- /flash-section -->

<!-- ===== AUDIO MODE ===== -->
<div class="audio-mode" id="audioMode">

  <div class="now-playing-card" id="npCard">
    <div class="np-label ja" id="npLang">🇯🇵 日本語</div>
    <div class="np-text-ja" id="npTextJa">再生ボタンを押してください</div>
    <div class="waveform paused" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="np-text-en" id="npTextEn" style="display:none"></div>
    <div class="np-counter" id="npCounter">— / 112</div>

</div><!-- /audio-mode -->

// ===== STATE =====
let deck = [...ALL_CARDS];
let currentIndex = 0;
let isFlipped = false;
let results = {};
let currentMode = 'flash';

// Audio mode state
let audioPlaying = false;
let audioPaused = false;
let audioIndex = 0;
let audioSpeed = 0.9;
let audioIntervalMs = 1200;
let audioTimeout = null;

// ===== MODE SWITCH =====
function setMode(mode) {
  currentMode = mode;
  document.getElementById('modeFlash').classList.toggle('active', mode === 'flash');
  document.getElementById('modeAudio').classList.toggle('active', mode === 'audio');
  document.getElementById('flashSection').style.display = mode === 'flash' ? '' : 'none';
  document.getElementById('audioMode').classList.toggle('show', mode === 'audio');
  document.getElementById('statsBar').style.display = mode === 'flash' ? '' : 'none';
  document.getElementById('progressLabel').textContent = mode === 'flash' ? '進捗' : '再生中';

  if (mode === 'audio') {
    stopAudio();
    updateAudioDisplay();
  } else {
    updateCard();
  }
}

// ===== FLASH MODE =====
function updateCard() {
  if (currentIndex >= deck.length) { showCompletion(); return; }
  const [ja, en] = deck[currentIndex];
  document.getElementById('jaText').textContent = ja;
  document.getElementById('enText').textContent = en;

  isFlipped = false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('btnOk').disabled = true;
  document.getElementById('btnRetry').disabled = true;

  const total = deck.length;
  document.getElementById('cardNum').textContent = `${currentIndex + 1} / ${total}`;
  document.getElementById('progressFill').style.width = Math.max(1, (currentIndex / total) * 100) + '%';
  document.getElementById('btnPrev').disabled = currentIndex === 0;
  document.getElementById('btnNext').disabled = currentIndex >= deck.length - 1;

  const ok = Object.values(results).filter(v => v === 'ok').length;
  const retry = Object.values(results).filter(v => v === 'retry').length;
  document.getElementById('okCount').textContent = ok;
  document.getElementById('retryCount').textContent = retry;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card').classList.toggle('flipped', isFlipped);
  if (isFlipped) {
    document.getElementById('btnOk').disabled = false;
    document.getElementById('btnRetry').disabled = false;
  }
}

function speakEN(e) {
  e.stopPropagation();
  speak(deck[currentIndex][1], 'en-US');
}

function speak(text, lang) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = audioSpeed;
  window.speechSynthesis.speak(u);
  return u;
}

function speakPromise(text, lang) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { resolve(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = audioSpeed;
    u.onend = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
  });
}

function markCard(type) {
  results[currentIndex] = type;
  goNext(1);
}

function goNext(dir) {
  const scene = document.getElementById('cardScene');
  const outClass = dir > 0 ? 'slide-out-left' : 'slide-out-right';
  const inClass  = dir > 0 ? 'slide-in-left'  : 'slide-in-right';
  scene.classList.add(outClass);
  setTimeout(() => {
    scene.classList.remove(outClass);
    currentIndex += dir;
    if (currentIndex < 0) currentIndex = 0;
    if (currentIndex >= deck.length) { showCompletion(); return; }
    updateCard();
    scene.classList.add(inClass);
    setTimeout(() => scene.classList.remove(inClass), 260);
  }, 220);
}

function navigate(dir) {
  const next = currentIndex + dir;
  if (next < 0 || next >= deck.length) return;
  goNext(dir);
}

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  currentIndex = 0;
  results = {};
  updateCard();
}

function showCompletion() {
  document.getElementById('completion').classList.add('show');
  const ok = Object.values(results).filter(v => v === 'ok').length;
  const retry = Object.values(results).filter(v => v === 'retry').length;
  document.getElementById('finalOk').textContent = ok;
  document.getElementById('finalRetry').textContent = retry;
  document.getElementById('btnRetryOnly').disabled = retry === 0;
}

function restartAll() {
  deck = [...ALL_CARDS];
  currentIndex = 0;
  results = {};
  document.getElementById('completion').classList.remove('show');
  updateCard();
}

function restartRetry() {
  const retryCards = deck.filter((_, i) => results[i] === 'retry');
  if (!retryCards.length) return;
  deck = retryCards;
  currentIndex = 0;
  results = {};
  document.getElementById('completion').classList.remove('show');
  updateCard();
}

// ===== SWIPE =====
let touchStartX = 0, touchStartY = 0;
const scene = document.getElementById('cardScene');
scene.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
scene.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    if (dx < 0 && currentIndex < deck.length - 1) navigate(1);
    if (dx > 0 && currentIndex > 0) navigate(-1);
  }
}, { passive: true });

// ===== AUDIO CARD SWIPE =====
let audioTouchStartX = 0, audioTouchStartY = 0;
const npCard = document.getElementById('npCard');
npCard.addEventListener('touchstart', e => {
  audioTouchStartX = e.touches[0].clientX;
  audioTouchStartY = e.touches[0].clientY;
}, { passive: true });
npCard.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - audioTouchStartX;
  const dy = e.changedTouches[0].clientY - audioTouchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    if (dx < 0 && audioIndex < ALL_CARDS.length - 1) audioNavigate(1);
    if (dx > 0 && audioIndex > 0) audioNavigate(-1);
  }
}, { passive: true });

function audioNavigate(dir) {
  // 再生中は停止してから移動
  const wasPlaying = audioPlaying;
  if (audioPlaying) {
    audioPlaying = false;
    window.speechSynthesis.cancel();
    clearTimeout(audioTimeout);
  }
  audioIndex = Math.max(0, Math.min(ALL_CARDS.length - 1, audioIndex + dir));

  // カードをアニメーション
  const card = document.getElementById('npCard');
  const outClass = dir > 0 ? 'slide-out-left' : 'slide-out-right';
  const inClass  = dir > 0 ? 'slide-in-left'  : 'slide-in-right';
  card.classList.add(outClass);
  setTimeout(() => {
    card.classList.remove(outClass);
    updateAudioDisplay();
    // 両面表示にリセット
    document.getElementById('npTextJa').style.display = '';
    document.getElementById('npTextEn').style.display = '';
    document.getElementById('npLang').textContent = '🇯🇵🇺🇸';
    document.getElementById('npLang').className = 'np-label ja';
    card.classList.add(inClass);
    setTimeout(() => card.classList.remove(inClass), 260);
  }, 220);

  // 再生中だった場合は新しい位置から再開
  if (wasPlaying) {
    setTimeout(() => {
      audioPlaying = true;
      document.getElementById('npLang').textContent = '🇯🇵 日本語';
      document.getElementById('npLang').className = 'np-label ja';
      document.getElementById('npTextEn').style.display = 'none';
      document.getElementById('npTextJa').style.display = '';
      runAudioLoop();
    }, 500);
  }
}

// ===== AUDIO MODE =====
function updateAudioDisplay() {
  const total = ALL_CARDS.length;
  const i = audioIndex;
  document.getElementById('cardNum').textContent = `${i + 1} / ${total}`;
  document.getElementById('progressFill').style.width = Math.max(1, (i / total) * 100) + '%';
  document.getElementById('npCounter').textContent = `${i + 1} / ${total}`;
  document.getElementById('npTextJa').textContent = ALL_CARDS[i][0];
  document.getElementById('npTextEn').textContent = ALL_CARDS[i][1];
}

async function runAudioLoop() {
  const total = ALL_CARDS.length;
  while (audioPlaying && audioIndex < total) {
    const [ja, en] = ALL_CARDS[audioIndex];

    // Show Japanese
    document.getElementById('npLang').textContent = '🇯🇵 日本語';
    document.getElementById('npLang').className = 'np-label ja';
    document.getElementById('npTextJa').style.display = '';
    document.getElementById('npTextEn').style.display = 'none';
    document.getElementById('waveform').classList.remove('paused');
    updateAudioDisplay();

    await speakPromise(ja, 'ja-JP');
    if (!audioPlaying) break;

    await sleep(audioIntervalMs);
    if (!audioPlaying) break;

    // Show English
    document.getElementById('npLang').textContent = '🇺🇸 English';
    document.getElementById('npLang').className = 'np-label en';
    document.getElementById('npTextEn').style.display = '';
    document.getElementById('npTextJa').style.display = 'none';

    await speakPromise(en, 'en-US');
    if (!audioPlaying) break;

    await sleep(audioIntervalMs);
    if (!audioPlaying) break;

    // Show both briefly
    document.getElementById('npTextJa').style.display = '';

    audioIndex++;
    updateAudioDisplay();
  }

  if (audioIndex >= total && audioPlaying) {
    audioPlaying = false;
    audioIndex = 0;
    document.getElementById('btnPlay').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> 再生開始';
    document.getElementById('waveform').classList.add('paused');
    document.getElementById('npTextJa').textContent = '完了！もう一度再生できます。';
    document.getElementById('npTextEn').style.display = 'none';
    updateAudioDisplay();
  }
}

function sleep(ms) {
  return new Promise(resolve => {
    if (!audioPlaying) { resolve(); return; }
    audioTimeout = setTimeout(resolve, ms);
  });
}

function togglePlay() {
  if (audioPlaying) {
    // Pause
    audioPlaying = false;
    window.speechSynthesis.cancel();
    clearTimeout(audioTimeout);
    document.getElementById('btnPlay').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> 再生再開';
    document.getElementById('waveform').classList.add('paused');
  } else {
    // Play / Resume
    audioPlaying = true;
    document.getElementById('btnPlay').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> 一時停止';
    document.getElementById('waveform').classList.remove('paused');
    runAudioLoop();
  }
}

function stopAudio() {
  audioPlaying = false;
  audioIndex = 0;
  window.speechSynthesis.cancel();
  clearTimeout(audioTimeout);
  document.getElementById('btnPlay').innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> 再生開始';
  document.getElementById('waveform').classList.add('paused');
  document.getElementById('npTextJa').textContent = '再生ボタンを押してください';
  document.getElementById('npTextEn').style.display = 'none';
  document.getElementById('npLang').textContent = '🇯🇵 日本語';
  document.getElementById('npLang').className = 'np-label ja';
  document.getElementById('npCounter').textContent = `1 / ${ALL_CARDS.length}`;
  document.getElementById('cardNum').textContent = `1 / ${ALL_CARDS.length}`;
  document.getElementById('progressFill').style.width = '1%';
}

function setSpeed(btn) {
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  audioSpeed = parseFloat(btn.dataset.speed);
}

function setInterval_(btn) {
  document.querySelectorAll('.interval-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  audioIntervalMs = parseInt(btn.dataset.ms);
}

// Init
updateCard();
</script>
</body>
</html>
